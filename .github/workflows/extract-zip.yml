name: Extract and replace project from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: new-uploaded-project
          fetch-depth: 0

      - name: Extract ZIP and replace repository files
        run: |
          python3 - <<'PY'
          import shutil
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          archives = list(root.glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one ZIP at repository root; found {len(archives)}")
          archive = archives[0]
          temp = Path(tempfile.mkdtemp(prefix="project-import-"))

          try:
              with zipfile.ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise RuntimeError(f"Corrupt ZIP member: {bad}")

                  for info in z.infolist():
                      rel = PurePosixPath(info.filename)
                      if rel.is_absolute() or ".." in rel.parts:
                          raise RuntimeError(f"Unsafe ZIP path: {info.filename}")
                      if ".git" in rel.parts or any(p == ".env" or p.startswith(".env.") for p in rel.parts):
                          continue
                      target = temp.joinpath(*rel.parts)
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with z.open(info) as src, target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

              # The supplied archive contains the project in this top-level folder.
              source = temp / "vox-royale-social-club"
              if not source.is_dir():
                  # Also support archives whose project files are at ZIP root.
                  candidates = [p for p in temp.iterdir() if p.is_dir()]
                  if len(candidates) == 1:
                      source = candidates[0]
                  else:
                      source = temp

              # Remove existing project content but preserve Git metadata and workflow directory.
              for item in list(root.iterdir()):
                  if item.name in {".git", ".github", archive.name}:
                      continue
                  if item.name == ".env" or item.name.startswith(".env."):
                      continue
                  if item.is_dir():
                      shutil.rmtree(item)
                  else:
                      item.unlink()

              for item in source.iterdir():
                  if item.name == ".git" or item.name == ".github":
                      continue
                  if item.name == ".env" or item.name.startswith(".env."):
                      continue
                  target = root / item.name
                  if item.is_dir():
                      shutil.copytree(item, target, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, target)

              archive.unlink()
              print("ZIP extracted; project files replaced; source ZIP removed.")
          finally:
              shutil.rmtree(temp, ignore_errors=True)
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract uploaded ZIP and replace project"
          git push origin HEAD:new-uploaded-project
